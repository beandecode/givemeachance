name: openclaw-main

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-app
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./config/api-keys.env
    environment:
      SETTINGS_FILE: ${SETTINGS_FILE:-config/settings.yaml}
      RESUME_FILE: ${RESUME_FILE:-config/resume.yaml}
      SEARCH_PARAMS_FILE: ${SEARCH_PARAMS_FILE:-config/search_params.yaml}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}
      ADMIN_BOOTSTRAP_USERNAME: ${ADMIN_BOOTSTRAP_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${ADMIN_BOOTSTRAP_PASSWORD:-}
      ADMIN_BOOTSTRAP_FORCE_RESET: ${ADMIN_BOOTSTRAP_FORCE_RESET:-false}
    volumes:
      - ./config:/app/config
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
