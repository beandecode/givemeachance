app:
  name: GivemeaChance (Localtest Live)
  db_path: output_localtest/job_assistant_localtest.db
  log_path: logs_localtest/pipeline_localtest.log

pipeline:
  daily_limit: 5
  max_description_length: 10000

data_sources:
  primary: adzuna_api
  secondary: none

mock_data:
  adzuna_file: data/mock/adzuna_jobs.json
  jooble_file: data/mock/jooble_jobs.json

llm:
  provider: gemini_api
  model: gemini-3.5-flash-lite
  prompt_version: v2
  fullstack_enabled: true

api_limits:
  gemini_daily_limit: 40
  adzuna_daily_limit: 10
  gemini_global_daily_limit: 50
  adzuna_global_daily_limit: 10
