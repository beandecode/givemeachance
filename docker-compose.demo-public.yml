# Overlay: the public live demo (ADR-018). Adds to docker-compose.demo.yml:
# - the tunnel: Cloudflare (docker-compose.cloudflare.yml) routes jobs.<domain> to `http://app:5001` on the main
#   stack's network, so the demo joins that network under the name `app`. Stop the main `openclaw-app` container
#   first: two containers must not answer to the same name.
# - guest workspaces on the real providers within the daily limits of config/settings.demo-live.yaml. Needs
#   config/api-keys.env and DEMO_FLASK_SECRET_KEY in .env.
#   docker compose -f docker-compose.demo.yml -f docker-compose.demo-public.yml up -d --build
services:
  app_demo:
    # The sample workspace is seeded with mock providers; the server then runs the live settings on the same database.
    command:
      - sh
      - -c
      - >-
        python scripts/seed_demo.py --settings config/settings.demo.yaml &&
        exec gunicorn --bind 0.0.0.0:5001 --workers 2 --threads 4 run:app
    env_file:
      - ./config/api-keys.env
    environment:
      DEMO_LIVE: "true"
      SETTINGS_FILE: config/settings.demo-live.yaml
      FLASK_SECRET_KEY: ${DEMO_FLASK_SECRET_KEY:?set DEMO_FLASK_SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: "true"
      TRUSTED_PROXY_HOPS: "1"
    networks:
      default: {}
      tunnel:
        aliases:
          - app

networks:
  tunnel:
    name: openclaw-main_default
    external: true
