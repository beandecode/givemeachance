name: openclaw-localtest

services:
  app_localtest:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openclaw-app-localtest
    command: ["gunicorn", "--bind", "0.0.0.0:5001", "--workers", "1", "--threads", "4", "--timeout", "120", "run:app"]
    ports:
      # Loopback by default; set LOCALTEST_BIND_ADDR in .env to a LAN IP to test from a phone.
      - "${LOCALTEST_BIND_ADDR:-127.0.0.1}:5011:5001"
    env_file:
      - ./config/api-keys.env
    environment:
      SETTINGS_FILE: config/settings.localtest.yaml
      RESUME_FILE: config/resume.yaml
      SEARCH_PARAMS_FILE: output_localtest/search_params.yaml
      # Secrets come from the gitignored .env (see .env.example); never hardcode them here.
      FLASK_SECRET_KEY: ${LOCALTEST_FLASK_SECRET_KEY:?set LOCALTEST_FLASK_SECRET_KEY in .env}
      SESSION_COOKIE_SECURE: "false"
      ADMIN_BOOTSTRAP_USERNAME: ${LOCALTEST_ADMIN_USERNAME:-}
      ADMIN_BOOTSTRAP_PASSWORD: ${LOCALTEST_ADMIN_PASSWORD:-}
      ADMIN_BOOTSTRAP_FORCE_RESET: ${LOCALTEST_ADMIN_FORCE_RESET:-false}
    volumes:
      - ./config:/app/config:ro
      - ./data:/app/data:ro
      - ./output_localtest:/app/output_localtest
      - ./logs_localtest:/app/logs_localtest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
